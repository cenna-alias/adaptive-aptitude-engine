{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block body %}
<div class="container">
  <div class="auth-wrap card">
    <h2 class="card-title">Create your student account</h2>
    <form method="post">
      <div class="form-row"><label for="full_name">Full name</label><input id="full_name" name="full_name"></div>
      <div class="form-row"><label for="username">Username *</label><input id="username" name="username" required></div>
      <div class="form-row"><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
      <div class="form-row"><label for="college">College / Organisation</label><input id="college" name="college"></div>
      <div class="form-row"><label for="password">Password * (min 6 characters)</label><input id="password" name="password" type="password" required minlength="6"></div>
      <button class="btn btn-primary btn-block" type="submit">Register</button>
    </form>
    <p class="form-hint">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}

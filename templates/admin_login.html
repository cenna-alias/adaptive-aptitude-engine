{% extends "base.html" %}
{% block title %}Admin login{% endblock %}
{% block body %}
<div class="container">
  <div class="auth-wrap card">
    <h2 class="card-title">Admin login</h2>
    <form method="post">
      <div class="form-row"><label for="identifier">Username</label><input id="identifier" name="identifier" required autofocus></div>
      <div class="form-row"><label for="password">Password</label><input id="password" name="password" type="password" required></div>
      <button class="btn btn-accent btn-block" type="submit">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
